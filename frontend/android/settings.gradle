// Resolve and include local plugin builds (outside pluginManagement so they
// register in the settings lifecycle before project evaluation).
def reactNativeGradlePlugin = null
try {
  def resolved = providers.exec {
    workingDir(rootDir)
    commandLine("node", "--print", "require.resolve('@react-native/gradle-plugin/package.json', { paths: [require.resolve('react-native/package.json')] })")
  }.standardOutput.asText.get().trim()
  println("DEBUG: require.resolve('@react-native/gradle-plugin') -> ${resolved}")
  reactNativeGradlePlugin = new File(resolved).getParentFile().absolutePath
  println("DEBUG: reactNativeGradlePlugin -> ${reactNativeGradlePlugin}")
} catch (Exception e) {
  println("DEBUG: react-native gradle plugin resolution failed: ${e.toString()}")
}

def expoPluginsPath = null
try {
  def resolvedExpo = providers.exec {
    workingDir(rootDir)
    commandLine("node", "--print", "require.resolve('expo-modules-autolinking/package.json', { paths: [require.resolve('expo/package.json')] })")
  }.standardOutput.asText.get().trim()
  println("DEBUG: require.resolve('expo-modules-autolinking') -> ${resolvedExpo}")
  expoPluginsPath = new File(resolvedExpo, "../android/expo-gradle-plugin").absolutePath
  println("DEBUG: expoPluginsPath -> ${expoPluginsPath}")
} catch (Exception e) {
  println("DEBUG: expo-modules-autolinking resolution failed: ${e.toString()}")
}

pluginManagement {
  repositories {
    mavenCentral()
    google()
    gradlePluginPortal()
  }

  if (reactNativeGradlePlugin != null) {
    try {
      includeBuild(reactNativeGradlePlugin)
      println("DEBUG: pluginManagement included react-native gradle plugin build: ${reactNativeGradlePlugin}")
    } catch (Exception e) {
      println("DEBUG: pluginManagement failed to include react-native gradle plugin build: ${e.toString()}")
    }
  }

  if (expoPluginsPath != null && new File(expoPluginsPath).exists()) {
    try {
      includeBuild(expoPluginsPath)
      println("DEBUG: pluginManagement included expo gradle plugin build: ${expoPluginsPath}")
    } catch (Exception e) {
      println("DEBUG: pluginManagement failed to include expo gradle plugin build: ${e.toString()}")
    }
  } else if (expoPluginsPath != null) {
    println("DEBUG: expo gradle plugin path does not exist; skipping pluginManagement includeBuild: ${expoPluginsPath}")
  }
}

if (reactNativeGradlePlugin != null) {
  try {
    includeBuild(reactNativeGradlePlugin)
    println("DEBUG: included react-native gradle plugin build: ${reactNativeGradlePlugin}")
  } catch (Exception e) {
    println("DEBUG: failed to include react-native gradle plugin build: ${e.toString()}")
  }
}

if (expoPluginsPath != null && new File(expoPluginsPath).exists()) {
  try {
    includeBuild(expoPluginsPath)
    println("DEBUG: included expo gradle plugin build: ${expoPluginsPath}")
  } catch (Exception e) {
    println("DEBUG: failed to include expo gradle plugin build: ${e.toString()}")
  }
} else if (expoPluginsPath != null) {
  println("DEBUG: expo gradle plugin path does not exist; skipping includeBuild: ${expoPluginsPath}")
}

// Apply the Expo autolinking settings plugin only if the expo gradle plugin
// folder is present. When the postinstall shim disables that folder (to
// avoid compiling the Kotlin plugin on the builder), skip applying the
// plugin so Gradle won't try to resolve a non-existent included build.
try {
  if (expoPluginsPath != null && new File(expoPluginsPath).exists()) {
    try {
      pluginManager.apply("expo-autolinking-settings")
      println("DEBUG: applied expo-autolinking-settings")
    } catch (Exception e) {
      println("DEBUG: could not apply expo-autolinking-settings: ${e.toString()}")
    }
  } else {
    println("DEBUG: skipping apply of expo-autolinking-settings; expo plugin folder missing: ${expoPluginsPath}")
  }
} catch (Exception e) {
  println("DEBUG: error while deciding to apply expo-autolinking-settings: ${e.toString()}")
}

try {
  extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
    if (System.getenv('EXPO_USE_COMMUNITY_AUTOLINKING') == '1') {
      ex.autolinkLibrariesFromCommand()
    } else {
      ex.autolinkLibrariesFromCommand(expoAutolinking.rnConfigCommand)
    }
  }
} catch (Exception e) {
  println("DEBUG: ReactSettingsExtension not available: ${e.toString()}")
}

try {
  if (extensions.findByName("expoAutolinking") != null) {
    expoAutolinking.useExpoModules()
  } else {
    println("DEBUG: expoAutolinking extension not found; skipping useExpoModules()")
  }
} catch (Exception e) {
  println("DEBUG: failed to call expoAutolinking.useExpoModules(): ${e.toString()}")
}

rootProject.name = 'KhushiBites'

try {
  if (extensions.findByName("expoAutolinking") != null) {
    expoAutolinking.useExpoVersionCatalog()
  } else {
    println("DEBUG: expoAutolinking extension not found; skipping useExpoVersionCatalog()")
  }
} catch (Exception e) {
  println("DEBUG: failed to call expoAutolinking.useExpoVersionCatalog(): ${e.toString()}")
}

include ':app'
try {
  if (extensions.findByName("expoAutolinking") != null && expoAutolinking.reactNativeGradlePlugin != null) {
    includeBuild(expoAutolinking.reactNativeGradlePlugin)
  } else {
    println("DEBUG: expoAutolinking.reactNativeGradlePlugin not available; skipping includeBuild")
  }
} catch (Exception e) {
  println("DEBUG: failed to include expoAutolinking.reactNativeGradlePlugin: ${e.toString()}")
}

pluginManagement {
  def reactNativeGradlePlugin = null
  try {
    def resolved = providers.exec {
      workingDir(rootDir)
      commandLine("node", "--print", "require.resolve('@react-native/gradle-plugin/package.json', { paths: [require.resolve('react-native/package.json')] })")
    }.standardOutput.asText.get().trim()
    println("DEBUG: require.resolve('@react-native/gradle-plugin') -> ${resolved}")
    reactNativeGradlePlugin = new File(resolved).getParentFile().absolutePath
    println("DEBUG: reactNativeGradlePlugin -> ${reactNativeGradlePlugin}")
    includeBuild(reactNativeGradlePlugin)
  } catch (Exception e) {
    println("DEBUG: react-native gradle plugin resolution failed: ${e.toString()}")
  }

  def expoPluginsPath = null
  try {
    def resolvedExpo = providers.exec {
      workingDir(rootDir)
      commandLine("node", "--print", "require.resolve('expo-modules-autolinking/package.json', { paths: [require.resolve('expo/package.json')] })")
    }.standardOutput.asText.get().trim()
    println("DEBUG: require.resolve('expo-modules-autolinking') -> ${resolvedExpo}")
    expoPluginsPath = new File(resolvedExpo, "../android/expo-gradle-plugin").absolutePath
    println("DEBUG: expoPluginsPath -> ${expoPluginsPath}")
    includeBuild(expoPluginsPath)
  } catch (Exception e) {
    println("DEBUG: expo-modules-autolinking resolution failed: ${e.toString()}")
  }
}

plugins {
  id("com.facebook.react.settings")
  id("expo-autolinking-settings")
}

extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
  if (System.getenv('EXPO_USE_COMMUNITY_AUTOLINKING') == '1') {
    ex.autolinkLibrariesFromCommand()
  } else {
    ex.autolinkLibrariesFromCommand(expoAutolinking.rnConfigCommand)
  }
}
expoAutolinking.useExpoModules()

rootProject.name = 'KhushiBites'

expoAutolinking.useExpoVersionCatalog()

include ':app'
includeBuild(expoAutolinking.reactNativeGradlePlugin)
